    upstream collabora_backend {
        server 127.0.0.1:9980 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # Mutable Collabora bootstrap HTML must revalidate so deploys take effect immediately.
    location = /browser/dist/cool.html {
        proxy_pass http://collabora_backend;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    # Versioned bootstrap HTML should also revalidate. The versioned path changes
    # on rebuilds, but keeping it non-immutable avoids clients pinning an old
    # bootstrap document longer than intended.
    location ~ ^/browser/[A-Za-z0-9._-]+/cool\.html$ {
        proxy_pass http://collabora_backend;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    # Versioned static assets can stay aggressively cached for performance.
    location ~ ^/browser/[A-Za-z0-9._-]+/(.*)$ {
        proxy_pass http://collabora_backend;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # static files
    location ^~ /browser {
        proxy_pass http://collabora_backend;
        proxy_set_header Host $host;
    }

    # WOPI discovery URL
    location ^~ /hosting/discovery {
        proxy_pass http://collabora_backend;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    # Capabilities
    location ^~ /hosting/capabilities {
        proxy_pass http://collabora_backend;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    # main websocket
    location ~ ^/cool/(.*)/ws$ {
        proxy_pass http://collabora_backend;
    # main websocket, download, presentation (legacy svg) and image upload
    location ^~ /cool/ {
        proxy_pass http://collabora_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 36000s;
    }

    # download, presentation and image upload
    # we accept 'lool' to be backward compatible
    location ~ ^/(c|l)ool {
        proxy_pass http://collabora_backend;
        proxy_set_header Host $host;
    }

    # Admin Console websocket
    location ^~ /cool/adminws {
        proxy_pass http://collabora_backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 36000s;
    }
    # backward compatibility for integrations that use the /lool/ POST API
    location ^~ /lool/ {
        proxy_pass http://collabora_backend;
        proxy_set_header Host $host;
    }

