 
services:
  coolwsd:
    build:
      context: ..
      dockerfile: online/Dockerfile
    image: smartdocs_coolwsd
    container_name: smartdocs_coolwsd
    network_mode: host
    restart: on-failure
    # Security capabilities needed for coolwsd
    cap_add:
      - SYS_ADMIN
      - MKNOD
      - FOWNER
      - CHOWN
      - SYS_CHROOT
    # Required for coolwsd to function properly (needs user namespaces)
    # privileged mode needed because host has apparmor_restrict_unprivileged_userns enabled
    privileged: true
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      - TZ=UTC
      - LO_ROOT=${LO_ROOT:-/srv/apps/libreoffice-mini/instdir}
      - PYUNO_SCRIPTS_DIR=${PYUNO_SCRIPTS_DIR:-/srv/apps/libreoffice-mini/instdir/share/Scripts/python}
    working_dir: /srv/apps/online
    # Build normally, then run coolwsd with --disable-cool-user-checking for Docker
    command:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /tmp/systemplate /tmp/jails /tmp/cache
        LO_ROOT="${LO_ROOT:-/srv/apps/libreoffice-mini-25/instdir}"
        ./coolwsd-systemplate-setup /tmp/systemplate "$LO_ROOT"
        # Copy Python scripts into systemplate so LibreOffice can find them
        mkdir -p /tmp/systemplate/lo/share/Scripts/python
        PYUNO_SCRIPTS_DIR="${PYUNO_SCRIPTS_DIR:-$LO_ROOT/share/Scripts/python}"
        if [ -d "$PYUNO_SCRIPTS_DIR" ]; then \
          cp -r "$PYUNO_SCRIPTS_DIR"/* /tmp/systemplate/lo/share/Scripts/python/; \
        else \
          echo "WARNING: PYUNO_SCRIPTS_DIR not found: $PYUNO_SCRIPTS_DIR"; \
        fi
        chmod -R 777 /tmp/systemplate /tmp/jails /tmp/cache
        sed -i 's|<sys_template_path[^>]*>[^<]*</sys_template_path>|<sys_template_path type="path" relative="false">/tmp/systemplate</sys_template_path>|' coolwsd.xml
        sed -i 's|<child_root_path[^>]*>[^<]*</child_root_path>|<child_root_path type="path" relative="false">/tmp/jails</child_root_path>|' coolwsd.xml
        sed -i 's|<file_server_root_path[^>]*>[^<]*</file_server_root_path>|<file_server_root_path type="path" relative="false">/srv/apps/online</file_server_root_path>|' coolwsd.xml
        sed -i 's|<username[^>]*></username>|<username>admin</username>|' coolwsd.xml
        sed -i 's|<password[^>]*></password>|<password>admin</password>|' coolwsd.xml
        # Configure frame-ancestors CSP to allow embedding from any origin (for development)
        # Using command-line option instead of sed for multiline XML
        cd browser && cp -a dist 25.04.9.0 && cd ..
        exec ./coolwsd --disable-cool-user-checking \
          --o:sys_template_path=/tmp/systemplate \
          --o:child_root_path=/tmp/jails \
          --o:cache_files.path=/tmp/cache \
          --o:file_server_root_path=/srv/apps/online \
          '--o:storage.filesystem[@allow]=true' \
          --o:ssl.enable=false \
          --o:admin_console.username=admin \
          --o:admin_console.password=admin \
          '--o:net.content_security_policy=frame-ancestors *;' \
          --o:logging.level=warning \
          --o:logging.level_startup=warning \
          '--o:logging.file[@enable]=false' \
          '--o:logging_ui_cmd.file[@enable]=false' \
          '--o:trace_event[@enable]=false' \
          --o:logging.protocol=false \
          --o:browser_logging=false \
          --o:num_prespawn_children=4
