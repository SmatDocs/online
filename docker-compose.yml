 
services:
  coolwsd:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartdocs_coolwsd
    container_name: smartdocs_coolwsd
    ports:
      - "9980:9980"
    volumes:
      # Mount the entire online source code directory at the SAME path as host
      # (Makefile has absolute paths from ./configure)
      - .:/srv/apps/online:rw
      # Mount LibreOffice core (required for coolwsd)
      - /srv/apps/libreoffice-mini:/srv/apps/libreoffice-mini:ro
      # Persist build artifacts and cache
      - coolwsd-build-cache:/srv/apps/online/.libs
      - coolwsd-cache:/srv/apps/online/cache
    networks:
      - smartdocs_network
    restart: on-failure
    # Security capabilities needed for coolwsd
    cap_add:
      - SYS_ADMIN
      - MKNOD
      - FOWNER
      - CHOWN
      - SYS_CHROOT
    # Required for coolwsd to function properly (needs user namespaces)
    # privileged mode needed because host has apparmor_restrict_unprivileged_userns enabled
    privileged: true
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      - TZ=UTC
    working_dir: /srv/apps/online
    # Build normally, then run coolwsd with --disable-cool-user-checking for Docker
    command: >
      sh -c "rm -rf browser/25.04.9.0 && cd /srv/apps/online/browser && npm install &&
             cd /srv/apps/online && make -j $$(nproc) &&
             mkdir -p /tmp/systemplate /tmp/jails /tmp/cache &&
             ./coolwsd-systemplate-setup /tmp/systemplate /srv/apps/libreoffice-mini/instdir &&
             chmod -R 777 /tmp/systemplate /tmp/jails /tmp/cache &&
             sed -i 's|<sys_template_path[^>]*>[^<]*</sys_template_path>|<sys_template_path type=\"path\" relative=\"false\">/tmp/systemplate</sys_template_path>|' coolwsd.xml &&
             sed -i 's|<child_root_path[^>]*>[^<]*</child_root_path>|<child_root_path type=\"path\" relative=\"false\">/tmp/jails</child_root_path>|' coolwsd.xml &&
             sed -i 's|<file_server_root_path[^>]*>[^<]*</file_server_root_path>|<file_server_root_path type=\"path\" relative=\"false\">/srv/apps/online</file_server_root_path>|' coolwsd.xml &&
             sed -i 's|<username[^>]*></username>|<username>admin</username>|' coolwsd.xml &&
             sed -i 's|<password[^>]*></password>|<password>admin</password>|' coolwsd.xml &&
             cd browser && cp -a dist 25.04.9.0 && cd .. &&
             ./coolwsd --disable-cool-user-checking
             --o:sys_template_path=/tmp/systemplate
             --o:child_root_path=/tmp/jails
             --o:cache_files.path=/tmp/cache
             --o:file_server_root_path=/srv/apps/online
             --o:storage.filesystem[@allow]=true
             --o:ssl.enable=false
             --o:admin_console.username=admin
             --o:admin_console.password=admin
             --o:logging.level=trace"

networks:
  smartdocs_network:
    external: true

volumes:
  coolwsd-build-cache:
    name: smartdocs-coolwsd-build-cache
  coolwsd-cache:
    name: smartdocs-coolwsd-cache
