name: Collabora Deploy

on:
  push:
    branches: [prod, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: false
        default: production
        type: choice
        options:
          - production
          - staging
      production_action:
        description: "Production deploy mode (ignored for staging)"
        required: false
        default: deploy_rolling
        type: choice
        options:
          - deploy_rolling
          - deploy_blue
          - deploy_green
          - deploy_both
          - rollback_blue
          - rollback_green
          - rollback_both
      production_ref:
        description: "Optional git ref (branch/tag/commit) for deploy_* modes"
        required: false
        default: ""
        type: string

concurrency:
  group: collabora-deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy Collabora Staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (github.event_name == 'push' && github.ref_name == 'staging') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.environment == 'staging')
    environment: staging
    steps:
      - name: Deploy staging via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          STAGING_DEPLOY_REF: staging
        with:
          host: ${{ secrets.COLLABORA_PRODUCTION_SSH_HOST }}
          username: ${{ secrets.COLLABORA_PRODUCTION_SSH_USER }}
          key: ${{ secrets.COLLABORA_PRODUCTION_SSH_KEY }}
          port: ${{ secrets.COLLABORA_PRODUCTION_SSH_PORT || 22 }}
          command_timeout: 30m
          script_stop: true
          envs: GH_REPO_TOKEN,REPO_URL,STAGING_DEPLOY_REF
          script: |
            set -euo pipefail
            cd "/home/humphry/online"
            git remote set-url origin "$REPO_URL"
            AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_REPO_TOKEN" | base64 -w0)"
            export GIT_CONFIG_COUNT=2
            export GIT_CONFIG_KEY_0=credential.helper
            export GIT_CONFIG_VALUE_0=
            export GIT_CONFIG_KEY_1=http.https://github.com/.extraheader
            export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $AUTH_HEADER"
            unset AUTH_HEADER GH_REPO_TOKEN
            STAGING_DEPLOY_REF="${STAGING_DEPLOY_REF:-staging}" \
              ./scripts/deploy/deploy_collabora_staging.sh "/home/humphry/online"

  deploy-production:
    name: Deploy Collabora Production (Blue-Green)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      (github.event_name == 'push' && github.ref_name == 'prod') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.environment == 'production' ||
        github.event.inputs.environment == ''))
    environment: production
    steps:
      - name: Deploy to Collabora host via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          PRODUCTION_BLUE_HEALTH_URL: ${{ secrets.COLLABORA_PRODUCTION_BLUE_HEALTH_URL }}
          PRODUCTION_GREEN_HEALTH_URL: ${{ secrets.COLLABORA_PRODUCTION_GREEN_HEALTH_URL }}
          DEPLOY_EVENT_NAME: ${{ github.event_name }}
          DEPLOY_PRODUCTION_ACTION: ${{ github.event.inputs.production_action }}
          DEPLOY_PRODUCTION_REF: ${{ github.event.inputs.production_ref }}
        with:
          host: ${{ secrets.COLLABORA_PRODUCTION_SSH_HOST }}
          username: ${{ secrets.COLLABORA_PRODUCTION_SSH_USER }}
          key: ${{ secrets.COLLABORA_PRODUCTION_SSH_KEY }}
          port: ${{ secrets.COLLABORA_PRODUCTION_SSH_PORT || 22 }}
          command_timeout: 60m
          script_stop: false
          envs: GH_REPO_TOKEN,REPO_URL,PRODUCTION_BLUE_HEALTH_URL,PRODUCTION_GREEN_HEALTH_URL,DEPLOY_EVENT_NAME,DEPLOY_PRODUCTION_ACTION,DEPLOY_PRODUCTION_REF
          script: |
            cat > /tmp/collabora-production-deploy.sh <<'REMOTE_SCRIPT'
            set -euo pipefail
            cd "/home/humphry/online"
            git remote set-url origin "$REPO_URL"
            AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_REPO_TOKEN" | base64 -w0)"
            export GIT_CONFIG_COUNT=2
            export GIT_CONFIG_KEY_0=credential.helper
            export GIT_CONFIG_VALUE_0=
            export GIT_CONFIG_KEY_1=http.https://github.com/.extraheader
            export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $AUTH_HEADER"
            unset AUTH_HEADER GH_REPO_TOKEN
            MODE="deploy_only"
            EVT="${DEPLOY_EVENT_NAME:-}"
            ACT="${DEPLOY_PRODUCTION_ACTION:-}"
            REF="${DEPLOY_PRODUCTION_REF:-}"
            if [ "$EVT" = "workflow_dispatch" ]; then
              case "$ACT" in
                deploy_blue) MODE="deploy_blue" ;;
                deploy_rolling) MODE="deploy_only" ;;
                deploy_green) MODE="deploy_green" ;;
                deploy_both) MODE="deploy_both" ;;
                rollback_blue) MODE="rollback_blue" ;;
                rollback_green) MODE="rollback_green" ;;
                rollback_both) MODE="rollback_both" ;;
                *) MODE="deploy_only" ;;
              esac
            fi

            echo "[workflow] Deploying Collabora with PRODUCTION_MODE=${MODE}"
            git fetch origin --prune --tags

            USE_DEPLOY_REF=0
            SCRIPT_REF="origin/prod"
            if [ -n "$REF" ]; then
              case "$MODE" in
                rollback_blue|rollback_green|rollback_both) true ;;
                *)
                  USE_DEPLOY_REF=1
                  if git rev-parse --verify --quiet "${REF}^{commit}" >/dev/null; then
                    SCRIPT_REF="$(git rev-parse "${REF}^{commit}")"
                  elif git rev-parse --verify --quiet "origin/${REF}^{commit}" >/dev/null; then
                    SCRIPT_REF="origin/${REF}"
                  fi
                  ;;
              esac
            fi

            DEPLOY_TMP_DIR="$(mktemp -d)"
            DEPLOY_SCRIPT="$DEPLOY_TMP_DIR/deploy_production_blue_green.sh"
            DRAIN_HELPER="$DEPLOY_TMP_DIR/deployment_drain.sh"
            trap 'rm -f "$DEPLOY_SCRIPT" "$DRAIN_HELPER"; rmdir "$DEPLOY_TMP_DIR"' EXIT
            git show "${SCRIPT_REF}:scripts/deploy/deploy_production_blue_green.sh" > "$DEPLOY_SCRIPT"
            git show "${SCRIPT_REF}:scripts/deploy/deployment_drain.sh" > "$DRAIN_HELPER"
            chmod +x "$DEPLOY_SCRIPT" "$DRAIN_HELPER"
            export PRODUCTION_SHUTDOWN_OLD_SLOT=true

            if [ "$USE_DEPLOY_REF" = "1" ]; then
              echo "[workflow] Using PRODUCTION_DEPLOY_REF=${REF}"
              PRODUCTION_MODE="${MODE}" PRODUCTION_DEPLOY_REF="${REF}" "$DEPLOY_SCRIPT" "/home/humphry/online"
            else
              PRODUCTION_MODE="${MODE}" "$DEPLOY_SCRIPT" "/home/humphry/online"
            fi
            REMOTE_SCRIPT
            bash /tmp/collabora-production-deploy.sh
